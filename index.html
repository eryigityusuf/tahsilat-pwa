<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Namaz Yoklama">
  <title>Namaz Yoklama</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:#f5f7f7; font-family:Arial,Helvetica,sans-serif; }
    body { overflow:hidden; }
    #app { position:fixed; inset:0; display:flex; flex-direction:column; }
    #bar {
      min-height:48px; padding:env(safe-area-inset-top) 12px 0;
      display:flex; align-items:center; gap:8px;
      background:#0f766e; color:white; box-shadow:0 1px 5px rgba(0,0,0,.18);
      z-index:3;
    }
    #title { font-weight:700; flex:1; }
    #status { font-size:12px; opacity:.92; }
    #reload {
      border:0; background:rgba(255,255,255,.16); color:white; border-radius:8px;
      padding:7px 10px; cursor:pointer;
    }
    #frame { border:0; width:100%; flex:1; background:white; }
    #offline {
      display:none; position:fixed; inset:48px 0 0 0; place-items:center;
      padding:24px; background:#f5f7f7; z-index:4;
    }
    .card {
      width:min(420px, 92vw); padding:28px; border-radius:18px; background:white;
      box-shadow:0 8px 32px rgba(0,0,0,.10); text-align:center;
    }
    .card h2 { margin:0 0 10px; color:#0f766e; }
    .card p { margin:0 0 18px; line-height:1.5; color:#46505a; }
    .card button {
      border:0; background:#0f766e; color:white; border-radius:10px;
      padding:11px 18px; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="bar">
      <div id="title">Namaz Yoklama</div>
      <div id="status">Bağlanıyor…</div>
      <button id="reload" type="button">Yenile</button>
    </div>

    <iframe id="frame"
      src="https://script.google.com/macros/s/AKfycby5_wXsLHny2VXss3kvzQi4NnKpRM-qEjPIhDOTPyXzJwRealYgl0-qHcEm0qS_2WBS/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      title="Namaz Yoklama">
    </iframe>
  </div>

  <div id="offline">
    <div class="card">
      <h2>İnternet bağlantısı yok</h2>
      <p>Namaz Yoklama uygulamasına erişmek için internet bağlantısı gereklidir.</p>
      <button type="button" onclick="location.reload()">Tekrar Dene</button>
    </div>
  </div>

  <script>
    const frame = document.getElementById('frame');
    const statusEl = document.getElementById('status');
    const offline = document.getElementById('offline');
    const reload = document.getElementById('reload');

    function updateNetwork() {
      if (navigator.onLine) {
        offline.style.display = 'none';
        statusEl.textContent = 'Çevrimiçi';
      } else {
        offline.style.display = 'grid';
        statusEl.textContent = 'Çevrimdışı';
      }
    }

    window.addEventListener('online', () => {
      updateNetwork();
      frame.src = 'https://script.google.com/macros/s/AKfycby5_wXsLHny2VXss3kvzQi4NnKpRM-qEjPIhDOTPyXzJwRealYgl0-qHcEm0qS_2WBS/exec';
    });

    window.addEventListener('offline', updateNetwork);

    frame.addEventListener('load', () => {
      if (navigator.onLine) statusEl.textContent = 'Hazır';
    });

    reload.addEventListener('click', () => {
      if (navigator.onLine) frame.src = 'https://script.google.com/macros/s/AKfycby5_wXsLHny2VXss3kvzQi4NnKpRM-qEjPIhDOTPyXzJwRealYgl0-qHcEm0qS_2WBS/exec';
      else updateNetwork();
    });

    updateNetwork();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
