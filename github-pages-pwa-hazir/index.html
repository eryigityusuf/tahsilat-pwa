<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163a5f">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Tahsilat, taahhüt, öğrenci, personel ve öğretmen ödemeleri yönetimi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tahsilat">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Tahsilat Yönetimi</title>
</head>
<body>
  <header class="pwa-bar">
    <div class="brand">
      <img src="./icons/icon-192.png" alt="" width="38" height="38">
      <div><strong>Tahsilat Yönetimi</strong><span>Drive tabanlı yönetim sistemi</span></div>
    </div>
    <div class="bar-actions">
      <span id="connectionStatus" class="connection online">Çevrimiçi</span>
      <button id="installButton" class="install-button" type="button" hidden>Uygulamayı yükle</button>
      <a class="external-link" href="https://script.google.com/macros/s/AKfycbzODsdn99mhtCfgIuWqnwpqHqFYHv3sP0W1XlZ7JCnOgrkvT8by43Tjz1UDxTA4G9En/exec?v=31" target="_blank" rel="noopener">Tarayıcıda aç</a>
    </div>
  </header>

  <main class="app-shell">
    <section id="loadingView" class="message-card" aria-live="polite">
      <img src="./icons/icon-192.png" alt="Tahsilat Yönetimi" width="84" height="84">
      <h1>Tahsilat Yönetimi</h1>
      <p>Uygulama güvenli Google Apps Script sunucusundan yükleniyor.</p>
      <div class="spinner" aria-hidden="true"></div>
    </section>

    <section id="offlineView" class="message-card" hidden>
      <img src="./icons/icon-192.png" alt="" width="84" height="84">
      <h1>İnternet bağlantısı yok</h1>
      <p>Finansal veriler cihazda çevrimdışı saklanmaz. Bağlantı geldiğinde uygulama otomatik olarak yeniden açılır.</p>
      <button id="retryButton" class="primary-button" type="button">Tekrar dene</button>
    </section>

    <iframe
      id="appFrame"
      title="Tahsilat Yönetimi uygulaması"
      src="https://script.google.com/macros/s/AKfycbzODsdn99mhtCfgIuWqnwpqHqFYHv3sP0W1XlZ7JCnOgrkvT8by43Tjz1UDxTA4G9En/exec?v=31"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      hidden></iframe>
  </main>

  <noscript>Bu uygulamanın çalışması için JavaScript etkin olmalıdır.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
